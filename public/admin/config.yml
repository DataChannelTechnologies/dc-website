# Decap CMS (formerly Netlify CMS) configuration.
# Production: GitHub backend. Editors log in with GitHub and need write access
# to the repo. The OAuth handshake goes through Netlify's OAuth provider
# (Project configuration -> Security -> OAuth -> install the GitHub provider).
# Local: `docker compose up` also starts decap-server on :8081, and
# `local_backend: true` makes /admin/index.html write straight to ./content.
backend:
  name: github
  repo: DataChannelTechnologies/dc-website
  branch: main
  # Netlify project the OAuth provider is installed on. Needed once the site
  # is served from a custom domain (e.g. www.datachannel.co).
  site_domain: datachanne1.netlify.app

local_backend:
  url: http://localhost:8081/api/v1

media_folder: public/images/uploads
public_folder: /images/uploads

site_url: https://datachanne1.netlify.app
logo_url: /images/logo.png

# Reusable field groups
_link: &link
  widget: object
  collapsed: true
  fields:
    - { label: Label, name: label, widget: string }
    - { label: URL, name: href, widget: string }

_slug: &slug
  label: URL slug
  name: slug
  widget: string
  pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', "Lowercase letters, numbers and hyphens only"]
  hint: "Becomes the page URL and file name. Don't change it on published pages: the URL won't move and SEO will suffer."

_seoTitle: &seoTitle { label: SEO title (optional), name: seoTitle, widget: string, required: false, default: "", hint: "Leave empty to use the standard template title" }
_seoDescription: &seoDescription { label: SEO description (optional), name: seoDescription, widget: text, required: false, default: "", hint: "Leave empty to use the standard template description" }
_md: &md { widget: markdown, required: false, default: "", buttons: [bold, italic, link, heading-three, bulleted-list, numbered-list, quote, code], editor_components: [image] }

_integrationRel: &integrationRel { widget: relation, collection: integrations, search_fields: [name], value_field: "{{slug}}", display_fields: [name] }
_destinationRel: &destinationRel { widget: relation, collection: destinations, search_fields: [name], value_field: "{{slug}}", display_fields: [name] }
_warehouseRel: &warehouseRel { widget: relation, collection: warehouses, search_fields: [name], value_field: "{{slug}}", display_fields: [name] }
_integrationTagRel: &integrationTagRel { widget: relation, collection: integration-tags, search_fields: [name], value_field: "{{slug}}", display_fields: [name], required: false, default: "" }
_destinationTagRel: &destinationTagRel { widget: relation, collection: destination-tags, search_fields: [name], value_field: "{{slug}}", display_fields: [name], required: false, default: "" }

collections:
  - name: pages
    label: Pages
    editor: { preview: false }
    files:
      - name: home
        label: Home page
        file: content/home.json
        format: json
        fields:
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }

          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Highlighted words, name: highlight, widget: string, hint: "Rendered after the title with a gradient" }
              - { label: Subtitle, name: subtitle, widget: text }
              - { <<: *link, label: Primary button, name: primaryCta }
              - { <<: *link, label: Secondary button, name: secondaryCta }
              - { label: Perks, name: perks, widget: list, field: { label: Perk, name: perk, widget: string } }

          - label: Stats strip
            name: stats
            widget: list
            summary: "{{value}} — {{label}}"
            fields:
              - { label: Value, name: value, widget: string }
              - { label: Label, name: label, widget: string }

          - label: Review badges
            name: reviews
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - label: Items
                name: items
                widget: list
                summary: "{{name}}"
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Image, name: image, widget: image }
                  - { label: URL, name: href, widget: string }

          - label: Customer logos
            name: logos
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - label: Logos
                name: items
                widget: list
                summary: "{{name}}"
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Image, name: image, widget: image }

          - label: Platform section
            name: platform
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: text }
              - label: Features
                name: features
                widget: list
                summary: "{{title}}"
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Body, name: body, widget: text }
                  - { label: Image, name: image, widget: image }
                  - { <<: *link, label: Link, name: cta }

          - label: Neo (AI analyst) section
            name: neo
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: text }
              - label: Features
                name: features
                widget: list
                summary: "{{title}}"
                hint: "The first feature is shown as the large tile"
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Body, name: body, widget: text }
                  - { label: Image, name: image, widget: image, required: false, default: "" }

          - label: Data activation section
            name: activation
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: text }
              - label: Tabs
                name: features
                widget: list
                summary: "{{tab}}"
                fields:
                  - { label: Tab label, name: tab, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Body, name: body, widget: text }
                  - { label: Image, name: image, widget: image }
                  - { <<: *link, label: Link, name: cta }

          - label: Testimonials
            name: testimonials
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - label: Featured quote
                name: featured
                widget: object
                fields:
                  - { label: Headline, name: headline, widget: string }
                  - { label: Quote, name: quote, widget: text }
                  - { label: Name, name: name, widget: string }
                  - { label: Role, name: role, widget: string }
                  - { label: Photo, name: image, widget: image, required: false, default: "" }
              - label: Cards
                name: items
                widget: list
                summary: "{{name}}"
                fields:
                  - { label: Headline, name: headline, widget: string }
                  - { label: Quote, name: quote, widget: text }
                  - { label: Name, name: name, widget: string }
                  - { label: Role, name: role, widget: string }
                  - { label: Photo, name: image, widget: image, required: false, default: "" }
                  - label: Stats
                    name: stats
                    widget: list
                    fields:
                      - { label: Value, name: value, widget: string }
                      - { label: Label, name: label, widget: string }

          - label: Trust badges
            name: trust
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - label: Badges
                name: badges
                widget: list
                summary: "{{name}}"
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Image, name: image, widget: image }
                  - { label: URL (optional), name: href, widget: string, required: false, default: "" }

          - label: Webinar
            name: webinar
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: text }
              - { label: Thumbnail, name: image, widget: image }
              - { <<: *link, label: Button, name: cta }

          - label: Blog teaser
            name: blog
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - label: Posts
                name: posts
                widget: list
                summary: "{{title}}"
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
                  - { label: Image, name: image, widget: image }
                  - { label: URL, name: href, widget: string }
              - { <<: *link, label: Button, name: cta }

          - label: Closing CTA cards
            name: ctaCards
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - label: Cards
                name: items
                widget: list
                summary: "{{title}}"
                fields:
                  - { label: Icon, name: icon, widget: select, options: [rocket, message, plug] }
                  - { label: Title, name: title, widget: string }
                  - { label: Body, name: body, widget: text }
                  - { <<: *link, label: Button, name: cta }


  # ---------------------------------------------------------------------------
  # Collections migrated from the Webflow CMS. URL = /<path>/<file name>.
  # ---------------------------------------------------------------------------
  - name: integrations
    label: Integrations (/integration/…)
    label_singular: Integration
    folder: content/integrations
    format: json
    extension: json
    create: true
    slug: "{{fields.slug}}"
    identifier_field: name
    summary: "{{name}} · {{category}}"
    sortable_fields: [name, releaseDate]
    editor: { preview: false }
    fields:
      - { label: Name, name: name, widget: string }
      - *slug
      - { <<: *integrationTagRel, label: Category, name: category }
      - { label: Short info, name: shortInfo, widget: text }
      - { label: Icon, name: icon, widget: image, required: false, default: "" }
      - { label: Hero image, name: image, widget: image, required: false, default: "" }
      - { <<: *md, label: Brief, name: brief }
      - { label: Show "About" section, name: showAbout, widget: boolean, default: true }
      - { <<: *md, label: About, name: about }
      - { <<: *md, label: Available data (pipelines), name: availableData }
      - { label: Source API documentation URL, name: sourceDocsUrl, widget: string, required: false, default: "" }
      - { label: DataChannel documentation URL, name: docsUrl, widget: string, required: false, default: "" }
      - { label: Release date, name: releaseDate, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false, default: "" }
      - *seoTitle
      - *seoDescription

  - name: etl-sources
    label: ETL source pages (/etl-sources/…)
    label_singular: ETL source page
    folder: content/etl-sources
    format: json
    extension: json
    create: true
    slug: "{{fields.slug}}"
    identifier_field: name
    summary: "{{name}}"
    sortable_fields: [name]
    editor: { preview: false }
    fields:
      - { label: Name, name: name, widget: string, hint: "Internal name, e.g. ETL Shopify Data to Snowflake" }
      - *slug
      - { <<: *integrationRel, label: Data source (integration), name: source }
      - { <<: *warehouseRel, label: Data warehouse, name: warehouse }
      - { <<: *integrationTagRel, label: Category, name: category }
      - { label: Show steps, name: showSteps, widget: boolean, default: true }
      - { <<: *md, label: Steps to configure, name: steps }
      - { label: Show video, name: showVideo, widget: boolean, default: false }
      - { label: Demo video URL (YouTube/Vimeo), name: videoUrl, widget: string, required: false, default: "" }
      - *seoTitle
      - *seoDescription

  - name: destinations
    label: Destinations (/destinations/…)
    label_singular: Destination
    folder: content/destinations
    format: json
    extension: json
    create: true
    slug: "{{fields.slug}}"
    identifier_field: name
    summary: "{{name}} · {{category}}"
    sortable_fields: [name, releaseDate]
    editor: { preview: false }
    fields:
      - { label: Name, name: name, widget: string }
      - *slug
      - { <<: *destinationTagRel, label: Category, name: category }
      - { label: Short info, name: shortInfo, widget: text }
      - { label: Icon, name: icon, widget: image, required: false, default: "" }
      - { label: Hero image, name: image, widget: image, required: false, default: "" }
      - { <<: *md, label: Brief, name: brief }
      - { label: Show "About" section, name: showAbout, widget: boolean, default: true }
      - { <<: *md, label: About, name: about }
      - { <<: *md, label: Available syncs, name: availableSync }
      - { label: Source API documentation URL, name: sourceDocsUrl, widget: string, required: false, default: "" }
      - { label: DataChannel documentation URL, name: docsUrl, widget: string, required: false, default: "" }
      - { label: Release date, name: releaseDate, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false, default: "" }
      - *seoTitle
      - *seoDescription

  - name: reverse-etl-destinations
    label: Reverse ETL pages (/reverse-etl-destinations/…)
    label_singular: Reverse ETL page
    folder: content/reverse-etl-destinations
    format: json
    extension: json
    create: true
    slug: "{{fields.slug}}"
    identifier_field: name
    summary: "{{name}}"
    sortable_fields: [name]
    editor: { preview: false }
    fields:
      - { label: Name, name: name, widget: string, hint: "Internal name, e.g. Snowflake to HubSpot" }
      - *slug
      - { <<: *warehouseRel, label: Data warehouse, name: warehouse }
      - { <<: *destinationRel, label: Destination, name: destination }
      - { <<: *destinationTagRel, label: Category, name: category }
      - { label: Show steps, name: showSteps, widget: boolean, default: true }
      - { <<: *md, label: Steps to configure, name: steps }
      - { label: Show video, name: showVideo, widget: boolean, default: false }
      - { label: Demo video URL (YouTube/Vimeo), name: videoUrl, widget: string, required: false, default: "" }
      - *seoTitle
      - *seoDescription

  - name: warehouses
    label: Warehouses (/warehouses/…)
    label_singular: Warehouse
    folder: content/warehouses
    format: json
    extension: json
    create: true
    slug: "{{fields.slug}}"
    identifier_field: name
    summary: "{{name}}"
    editor: { preview: false }
    fields:
      - { label: Name, name: name, widget: string }
      - *slug
      - { label: Logo, name: logo, widget: image, required: false, default: "" }
      - { label: Logo alt text, name: logoAlt, widget: string, required: false, default: "" }
      - { label: Icon, name: icon, widget: image, required: false, default: "" }
      - { label: Icon alt text, name: iconAlt, widget: string, required: false, default: "" }
      - { label: Information link, name: informationLink, widget: string, required: false, default: "" }
      - { label: Managed warehouse available, name: managedWarehouseAvailable, widget: boolean, default: false }
      - *seoTitle
      - *seoDescription

  - name: integration-tags
    label: Integration categories
    label_singular: Integration category
    folder: content/integration-tags
    format: json
    extension: json
    create: true
    slug: "{{fields.slug}}"
    identifier_field: name
    editor: { preview: false }
    fields: &tagFields
      - { label: Name, name: name, widget: string }
      - *slug
      - { label: Text colour, name: color, widget: color, required: false, default: "" }
      - { label: Background colour, name: background, widget: color, required: false, default: "" }

  - name: destination-tags
    label: Destination categories
    label_singular: Destination category
    folder: content/destination-tags
    format: json
    extension: json
    create: true
    slug: "{{fields.slug}}"
    identifier_field: name
    editor: { preview: false }
    fields: *tagFields

  - name: settings
    label: Site settings
    editor: { preview: false }
    files:
      - name: site
        label: Header, navigation & footer
        file: content/site.json
        format: json
        fields:
          - { label: Site name, name: name, widget: string }
          - { label: Logo, name: logo, widget: image }
          - { label: Contact email, name: email, widget: string }
          - label: Announcement bar
            name: announcement
            widget: object
            fields:
              - { label: Show, name: enabled, widget: boolean }
              - { label: Text, name: text, widget: string }
              - { <<: *link, label: Link, name: link }
          - label: Main navigation
            name: nav
            widget: list
            summary: "{{label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: URL (leave empty for dropdowns), name: href, widget: string, required: false, default: "" }
              - label: Dropdown items
                name: items
                widget: list
                required: false
                default: []
                summary: "{{label}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Description, name: description, widget: string }
                  - { label: URL, name: href, widget: string }
          - label: Header buttons
            name: headerCtas
            widget: object
            fields:
              - { <<: *link, label: Sign in, name: signIn }
              - { <<: *link, label: Sign up, name: signUp }
          - label: Footer
            name: footer
            widget: object
            fields:
              - { label: Tagline, name: tagline, widget: text }
              - label: Link columns
                name: columns
                widget: list
                summary: "{{title}}"
                fields:
                  - { label: Title, name: title, widget: string }
                  - label: Links
                    name: links
                    widget: list
                    summary: "{{label}}"
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: URL, name: href, widget: string }
              - label: Legal links
                name: legal
                widget: list
                summary: "{{label}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: href, widget: string }
              - label: Social links
                name: social
                widget: list
                summary: "{{platform}}"
                fields:
                  - { label: Platform, name: platform, widget: select, options: [linkedin, x, facebook] }
                  - { label: URL, name: href, widget: string }
              - { label: Copyright, name: copyright, widget: string }
