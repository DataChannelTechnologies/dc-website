<!doctype html>
<!-- Netlify Forms detection file (not linked anywhere). Forms on the site POST here.
     Every field a form can submit must be listed, see src/components/forms/form-definitions.ts -->
<html>
  <body>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="name" /><input name="email" /><input name="subject" /><textarea name="message"></textarea><input name="page" />
    </form>
    <form name="lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="name" /><input name="email" /><input name="company" /><input name="phone" /><textarea name="message"></textarea><input name="offer" /><input name="page" />
    </form>
    <form name="career-application" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input name="bot-field" /><input name="name" /><input name="email" /><input name="position" /><input type="file" name="resume" /><input name="page" />
    </form>
  </body>
</html>
